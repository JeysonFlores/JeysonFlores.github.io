<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Personal researcher page" />
  <title>Curriculum Vitae - Jeyson Flores</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="static/assets/styles/website.css" />
</head>

<body>

  <!-- Navbar -->
  <header class="navbar">
    <span class="navbar-name" id="navbar-name"></span>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark/light mode">
      <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
      </svg>
      <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>
  </header>

  <main class="main-content">

    <!-- Left sidebar: Profile -->
    <aside class="profile-sidebar" id="section-profile">
      <div class="profile-photo-wrapper">
        <img class="profile-photo" src="static/assets/images/profile.jpg" alt="Profile photo" id="profile-photo" />
      </div>
      <h1 class="profile-name" id="profile-name"></h1>
      <p class="profile-subtitle" id="profile-subtitle"></p>
      <div class="profile-contact-block">
        <hr class="contact-divider" />
        <div class="profile-links" id="profile-links"></div>
        <hr class="contact-divider" />
      </div>
    </aside>

    <!-- Right column: sections -->
    <div class="sections-column">

      <!-- Education -->
      <section id="section-education">
        <div class="section-heading">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
            <path d="M6 12v5c3 3 9 3 12 0v-5" />
          </svg>
          <h2>Education</h2>
        </div>
        <div class="timeline" id="education-list"></div>
      </section>

      <hr class="divider" />

      <!-- Experience -->
      <section id="section-experience">
        <div class="section-heading">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="14" x="2" y="7" rx="2" ry="2" />
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
          </svg>
          <h2>Experience</h2>
        </div>
        <div class="timeline" id="experience-list"></div>
      </section>

      <hr class="divider" />

      <!-- Publications -->
      <section id="section-publications">
        <div class="section-heading">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
            <path d="M14 2v4a2 2 0 0 0 2 2h4" />
            <path d="M10 9H8" />
            <path d="M16 13H8" />
            <path d="M16 17H8" />
          </svg>
          <h2>Publications</h2>
        </div>
        <div id="publications-list"></div>
      </section>

    </div>

  </main>

  <footer class="footer">
    <span id="footer-name"></span>
  </footer>

  <script src="static/assets/scripts/website.js"></script>
</body>

</html>
